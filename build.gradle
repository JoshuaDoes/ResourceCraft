plugins {
	id 'net.fabricmc.fabric-loom' version '1.15.5'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven { url 'https://maven.midnightdust.eu/releases' }
	maven { url 'https://maven.terraformersmc.com/' }
	maven { url 'https://api.modrinth.com/maven' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Config
	implementation "eu.midnightdust:midnightlib:${project.midnightlib_version}"

	// Mod Menu
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

tasks.named('jar') {
    archiveFileName = "ResourceCraft-v${project.mod_version}-${project.minecraft_version}-dev.jar"
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
}

tasks.named('remapJar') {
    archiveFileName = "ResourceCraft-v${project.mod_version}-${project.minecraft_version}.jar"
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
